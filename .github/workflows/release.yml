name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and verify without publishing
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# `id-token` is what npm provenance signs with; `contents: write` is only used
# by the final `gh release create`. Every third-party action is pinned by
# commit SHA so a moved tag cannot change what runs with these permissions.
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4 (resolved commit)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      # pnpm/action-setup@v4 (resolved commit)
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.24.0

      # actions/setup-node@v4 (resolved commit)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.x
          cache: pnpm
          # No registry-url: it writes an .npmrc holding `_authToken=${NODE_AUTH_TOKEN}`,
          # and npm fails to interpolate an unset variable. Trusted Publishing
          # authenticates through the OIDC token (`id-token: write`) instead.

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify before building
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      # `prepublishOnly` only re-verifies; nothing rebuilds after this point, so
      # the tarball published below is byte-for-byte the one gated here.
      - name: Build and package gates
        run: |
          pnpm build
          pnpm compat
          pnpm verify:package

      - name: Tag must match the published version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match packages/cli version ${version}" >&2
            exit 1
          fi

      - name: Pack once
        id: pack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          npm pack --pack-destination "$RUNNER_TEMP/dist" ./packages/cli
          tarball="$(ls "$RUNNER_TEMP/dist"/*.tgz | head -1)"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "packed ${tarball}"

      # Same tarball, installed the way a user does it: npm global prefix, no
      # workspace, no pnpm.
      - name: Install smoke on the packed tarball
        env:
          DSH_TUI_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: pnpm smoke:install

      # Trusted Publishing: npm exchanges the job's OIDC token for a
      # short-lived credential, so there is no secret to leak and nothing to
      # rotate. `--provenance` is what ties the tarball to this workflow.
      - name: Publish the verified tarball
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/publish.log"
          if npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance --ignore-scripts 2>&1 | tee "$log"; then
            exit 0
          fi
          # Surface npm's own diagnosis as an annotation: the job log needs an
          # admin token to read, and "exit code 1" alone is not actionable. The
          # tail is kept whole (up to 2 kB) because npm puts the reason after
          # the URL, and truncating there hid it once already.
          tail -n 25 "$log" | tr '\n' ' ' | cut -c1-2000 | sed 's/^/::error::/'
          exit 1

      # `gh` ships with the runner, so the release step adds no third-party
      # action to the job that holds the npm token and the OIDC permission.
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.tarball }}" \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            --notes "Terminal front end for DeepSeek Harness.

          \`\`\`
          npm install -g @gblelis/dsh-tui
          dsh-tui doctor
          dsh-tui
          \`\`\`

          Requires Node.js >= 24.9 and a real terminal. Targets \`@deepseek-ai/dsh\`
          \`^0.2.2-rc.5 || ^0.2.3-alpha.2\`; \`dsh-tui doctor\` reports skew, and the TUI
          itself warns when a newer dsh is published."
