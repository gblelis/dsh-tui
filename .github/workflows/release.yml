name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and verify without publishing
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # GitHub release
  id-token: write # npm provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify before building
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Build and package gates
        run: |
          pnpm build
          pnpm compat
          pnpm verify:package

      - name: Tag must match the published version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match packages/cli version ${version}" >&2
            exit 1
          fi

      # The tarball is exactly what the release installs from, so verify it the
      # same way a user would before anything is published.
      - name: Install smoke
        run: pnpm smoke:install

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Pack the tarball for the GitHub release
        run: cd packages/cli && npm pack --pack-destination "$GITHUB_WORKSPACE"

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ./*.tgz
          body: |
            Terminal front end for DeepSeek Harness.

            ```bash
            npm install -g @gblelis/dsh-tui
            dsh-tui doctor
            dsh-tui
            ```

            This tag is also installable exactly as `@gblelis/dsh-tui@<version>`.

            Requires Node.js >= 24.9 and a real terminal. This release targets
            `@deepseek-ai/dsh` `^0.2.2-rc.5`; `dsh-tui doctor` reports skew.
