name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 24.9 is the declared floor (same as dsh); 24.x proves the floor holds.
        node: ['24.9.0', '24.x']
        os: [ubuntu-latest, macos-latest]
    steps:
      # Actions are pinned by commit SHA: a moved tag must not change what runs.
      # actions/checkout@v4 (resolved commit)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The compat gate reads the upstream tree at the pinned release.
          submodules: recursive

      # pnpm/action-setup@v4 (resolved commit)
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.24.0

      # actions/setup-node@v4 (resolved commit)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # Informational: the advisories that remain are pinned inside the dsh
      # runtime this project tracks, so they cannot be patched here. Failing on
      # them would block every release until upstream moves; see
      # docs/seguranca.md for the reachability analysis.
      - name: Dependency audit (informational)
        if: runner.os == 'Linux' && matrix.node == '24.x'
        continue-on-error: true
        run: pnpm audit --audit-level moderate

      - name: Build
        run: pnpm build

      - name: Compatibility gate
        run: pnpm compat

      - name: Package gate
        run: pnpm verify:package

      # Packs, installs the tarball with npm into a throwaway prefix and boots
      # it: the one gate that proves a user's install path end to end.
      - name: Install smoke (npm install -g from the tarball)
        if: runner.os == 'Linux' && matrix.node == '24.x'
        run: pnpm smoke:install

      - name: Screen smoke (renders the real TUI headlessly)
        run: pnpm smoke:screen -- --delay 5000

      - name: Chat smoke (scripted prompt against a local model server)
        run: pnpm smoke:chat

      # The other smokes replace the terminal; this one drives the real
      # ProcessTerminal through script(1). It skips itself where no PTY exists.
      - name: 'PTY boot (ubuntu only: util-linux script)'
        if: runner.os == 'Linux'
        run: pnpm vitest run tests/pty.spec.ts

      - name: Smoke (launcher, no TTY)
        run: |
          set -euo pipefail
          export DSH_HOME="$(mktemp -d)"
          node packages/cli/lib/bin.js install
          node packages/cli/lib/bin.js doctor --json > doctor.json || true
          cat doctor.json
          node packages/cli/lib/bin.js version
          # Composition must succeed and list the terminal rows.
          node "$(node packages/cli/lib/bin.js runtime | head -1)" --profile tui --dump-config > dump.yml
          grep -q "id: tui$" dump.yml
          grep -q "@gblelis/dsh-tui-bundle/startup" dump.yml
          # Without a TTY the front door must fail loudly, never hang.
          if node packages/cli/lib/bin.js </dev/null >/dev/null 2>boot.err; then
            echo "expected a failure without a TTY"; exit 1
          fi
          grep -q "needs a TTY" boot.err

  windows-smoke:
    name: windows launcher smoke
    runs-on: windows-latest
    steps:
      # actions/checkout@v4 (resolved commit)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # pnpm/action-setup@v4 (resolved commit)
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.24.0
      # actions/setup-node@v4 (resolved commit)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Launcher commands
        shell: pwsh
        run: |
          $env:DSH_HOME = Join-Path $env:RUNNER_TEMP "dsh-home"
          node packages/cli/lib/bin.js install
          node packages/cli/lib/bin.js version
          node packages/cli/lib/bin.js profile --json
